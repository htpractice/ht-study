# CertificateSigningRequest — client cert for CN=ht (kube-apiserver-client signer)
#
# Cluster-scoped — NO metadata.namespace (ignored if set).
# spec.request = base64(ht.csr) — regenerate after new openssl CSR:
#   cat ht.csr | base64 | tr -d '\n'
#
# Workflow:
#   kc apply -f csr.yaml
#   kc get csr ht
#   kc certificate approve ht
#   kc get csr ht -o jsonpath='{.status.certificate}' | base64 -d > ht.crt
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: ht
spec:
  request: 
  signerName: kubernetes.io/kube-apiserver-client
  expirationSeconds: 86400
  usages:
  - client auth
