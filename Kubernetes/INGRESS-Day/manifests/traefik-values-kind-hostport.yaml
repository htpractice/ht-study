# Helm values for kind with extraPortMappings on :80/:443 (Option B in traefik-install.md)
# Requires: kind create cluster --config kind-ingress-config.yaml
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

service:
  type: NodePort

ports:
  web:
    port: 80
    nodePort: 30080
  websecure:
    port: 443
    nodePort: 30443
