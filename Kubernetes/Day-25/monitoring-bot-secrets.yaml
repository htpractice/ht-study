# Legacy long-lived SA token Secret (pre-1.24 style / course demo)
#
# annotation kubernetes.io/service-account.name links Secret → ServiceAccount
# Modern K8s: projected volume tokens (bound, rotatable) — see notes
#
# Verify:
#   kc get secret monitoring-bot-secret -n deamon-monitoring
#   kc describe secret monitoring-bot-secret -n deamon-monitoring
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-bot-secret
  namespace: deamon-monitoring
  annotations:
    kubernetes.io/service-account.name: monitoring-bot
type: kubernetes.io/service-account-token
