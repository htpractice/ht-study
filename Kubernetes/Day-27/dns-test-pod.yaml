# Ephemeral pod for CoreDNS / nslookup labs (Day 27)
#
# Verify:
#   kc run dns-test --rm -it --restart=Never --image=busybox:1.36 -- sh
#   nslookup kubernetes.default
#   nslookup backend-svc.backend-app.svc.cluster.local
#
# Or apply this manifest for a named debug pod:
apiVersion: v1
kind: Pod
metadata:
  name: dns-test
  namespace: default
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sleep", "3600"]
