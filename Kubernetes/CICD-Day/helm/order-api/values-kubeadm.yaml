# kubeadm EC2 lab — no cloud LoadBalancer; NodePort for curl from worker IP
replicaCount: 3

image:
  repository: hthaware2508/order-api-lab
  tag: v1
  pullPolicy: Always
  pullSecrets:
    - dockerhub-creds

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

env:
  logLevel: INFO
  port: "8080"
  serviceVersion: v1
  deploymentEnv: kubeadm-lab

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

prometheus:
  scrape: true
  port: "8080"
  path: /metrics
