# Prometheus Helm values — observability namespace
#
# Install:
#   helm install prometheus prometheus-community/prometheus \
#     -n observability -f prometheus-values.yaml
#
# Grafana datasource URL: http://prometheus-server:80
#
# kube-state-metrics + node-exporter enabled for Grafana dashboard 6417
# (kube_pod_info, container_cpu_usage_seconds_total, etc.)
---
server:
  global:
    scrape_interval: 15s
  persistentVolume:
    enabled: false  # kind lab — no PVC needed

  # Discover pods annotated with prometheus.io/scrape=true (order-api Deployment)
  extraScrapeConfigs: |
    - job_name: kubernetes-pods-annotated
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod
    - job_name: otel-collector
      static_configs:
        - targets: ["otel-collector.observability.svc.cluster.local:8889"]

alertmanager:
  enabled: false
kube-state-metrics:
  enabled: true   # kube_pod_info — required for dashboard 6417
prometheus-node-exporter:
  enabled: true   # node-level CPU/mem metrics
prometheus-pushgateway:
  enabled: false
