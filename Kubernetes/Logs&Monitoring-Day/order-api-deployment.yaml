# order-api Deployment — instrumented Flask app for logs + metrics lab
#
# Key observability pieces:
#   - Pod annotations: tell Prometheus to scrape /metrics on port 8080
#   - stdout: structured JSON logs (picked up by Promtail → Loki)
#   - Probes: /health keeps unhealthy pods out of Service endpoints
#
# Build image first: see lab-guide.md Phase 1
#   docker build -t hthaware2508/order-api-lab:v1 APP/
#   docker push hthaware2508/order-api-lab:v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: order-api
  labels:
    app: order-api
spec:
  replicas: 2  # spread across nodes — watch per-pod metrics in Grafana
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
      annotations:
        # Prometheus discovers pods with these annotations (see prometheus-values.yaml)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"      # container port, not Service port
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: order-api
          image: hthaware2508/order-api-lab:v1
          imagePullPolicy: Always       # pick up new pushes to Docker Hub
          ports:
            - name: http
              containerPort: 8080       # Flask listens here
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
