# Loki stack Helm values — logs pipeline
#
# Install:
#   helm install loki grafana/loki-stack \
#     -n observability --create-namespace -f loki-stack-values.yaml
#
# Components:
#   Promtail (DaemonSet) → tails pod stdout on every node → pushes to Loki
#   Loki                 → log storage + query API (:3100)
#   Grafana              → Explore / dashboards (admin password below)
#
# Grafana datasource URL: http://loki:3100  (404 on / is normal; use Explore)
# Port-forward: kubectl port-forward -n observability svc/loki-grafana 3000:80
---
grafana:
  enabled: true
  adminPassword: cka-lab
  service:
    type: ClusterIP

promtail:
  enabled: true
  config:
    clients:
      - url: http://{{ .Release.Name }}:3100/loki/api/v1/push

loki:
  enabled: true
  isDefault: false
