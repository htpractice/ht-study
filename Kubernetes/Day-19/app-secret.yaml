# Secret — credentials (declarative, stringData for readable manifests)
#
# stringData → API stores as base64 in .data (you never hand-encode in labs)
# type Opaque = generic key/value secret (default)
#
# Verify:
#   kc apply -f app-secret.yaml
#   kc get secret db-creds -n configmaps -o yaml   # .data values are base64
#   kc get secret db-creds -n configmaps -o jsonpath='{.data.password}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: configmaps
type: Opaque
stringData:
  username: admin
  password: s3cr3t
