# Pod — inject Secret keys as environment variables
#
# Pattern: secretKeyRef (mirror of configMapKeyRef from pod-cm.yaml)
# Interview: same shape, different source — never log these env vars
#
# Verify:
#   kc apply -f pod-secret-env.yaml
#   kc exec -it secret-env-pod -n configmaps -- printenv | grep DB_
#   kc exec -it secret-env-pod -n configmaps -- bash -c 'echo user=$DB_USER pass=$DB_PASSWORD'
apiVersion: v1
kind: Pod
metadata:
  name: secret-env-pod
  namespace: configmaps
  labels:
    app: secret-env-pod
spec:
  containers:
  - name: app
    image: nginx
    ports:
    - containerPort: 80
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-creds
          key: username
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-creds
          key: password
