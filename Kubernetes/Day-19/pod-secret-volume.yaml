# Pod — mount Secret as read-only files (production-favored pattern)
#
# Each Secret key → filename under mountPath:
#   /etc/db-creds/username
#   /etc/db-creds/password
#
# Apps read files instead of env — avoids creds in process list / /proc
#
# Verify:
#   kc apply -f pod-secret-volume.yaml
#   kc exec -it secret-vol-pod -n configmaps -- ls -la /etc/db-creds
#   kc exec -it secret-vol-pod -n configmaps -- cat /etc/db-creds/username
apiVersion: v1
kind: Pod
metadata:
  name: secret-vol-pod
  namespace: configmaps
  labels:
    app: secret-vol-pod
spec:
  volumes:
  - name: db-creds-vol
    secret:
      secretName: db-creds
      defaultMode: 0400
  containers:
  - name: app
    image: nginx
    ports:
    - containerPort: 80
    volumeMounts:
    - name: db-creds-vol
      mountPath: /etc/db-creds
      readOnly: true
