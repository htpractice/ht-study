# Stress pod — intentionally exceeds memory limit to demonstrate OOM enforcement.
#
# Resources vs stress args (the mismatch is on purpose):
#   memory limit: 150Mi     stress --vm-bytes: 250Mi  → EXCEEDS → OOM / CrashLoopBackOff
#   cpu limit:    500m      stress --cpu: 1           → throttled (not killed)
#
# requests: 50Mi/250m  — what scheduler reserves on the node
# limits:   150Mi/500m — hard cap enforced by kubelet/cgroups
# QoS class: Burstable (requests ≠ limits)
#
# Verify:
#   kc apply -f limit-pod.yaml
#   kc describe pod limit-pod -n resourcelimits
#   kc top pod limit-pod -n resourcelimits   # requires metric-server.yaml
#
# Fix CrashLoopBackOff: set limits.memory > 250Mi OR reduce --vm-bytes below 150Mi
apiVersion: v1
kind: Pod
metadata:
  name: limit-pod
  namespace: resourcelimits
  labels:
    app: limit-pod
spec:
  containers:
  - name: stress
    image: polinux/stress
    command: ["stress"]
    args:
    - --cpu
    - "1"
    - --vm-bytes
    - "250Mi"
    - --vm-hang
    - "1"
    resources:
      requests:
        cpu: 250m
        memory: 50Mi
      limits:
        cpu: 500m
        memory: 150Mi
