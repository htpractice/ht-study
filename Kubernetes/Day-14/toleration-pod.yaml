# Toleration lab — allows pod to schedule on nodes tainted gpu=true:NoSchedule
#
# Taint the node first:
#   kc taint node <node-name> gpu=true:NoSchedule
#
# Without toleration, new pods won't schedule on that node.
# With toleration, this pod CAN — but is not forced to (other untainted nodes still work).
#
# Generate base:
#   kc run toleration-pod --image=nginx --dry-run=client -o yaml > toleration-pod.yaml
#
# Remove taint:
#   kc taint node <node-name> gpu=true:NoSchedule-
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: toleration-pod
  name: toleration-pod
spec:
  containers:
  - image: nginx
    name: toleration-pod
    resources:
      requests:
        memory: 64Mi
        cpu: 100m
      limits:
        memory: 128Mi
        cpu: 200m
  tolerations:
  - key: "gpu"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
