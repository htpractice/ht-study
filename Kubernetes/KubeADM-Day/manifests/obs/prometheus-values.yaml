# obs cluster — Prometheus + Grafana (single Grafana for whole obs stack)
# dotdc dashboards 15757/15760 need label `cluster` on stored metrics (scrape relabel, NOT external_labels).
server:
  global:
    scrape_interval: 15s
  persistentVolume:
    enabled: false
  extraScrapeConfigs: |
    - job_name: kubernetes-pods-annotated
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod
        - target_label: cluster
          replacement: obs
    - job_name: obs-kube-state-metrics
      static_configs:
        - targets: ["prometheus-kube-state-metrics.observability.svc.cluster.local:8080"]
      metric_relabel_configs:
        - target_label: cluster
          replacement: obs
    - job_name: obs-node-exporter
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - source_labels: [__address__]
          regex: "(.*):10250"
          replacement: "${1}:9100"
          target_label: __address__
        - target_label: cluster
          replacement: obs
      metric_relabel_configs:
        - target_label: cluster
          replacement: obs
    - job_name: otel-collector
      static_configs:
        - targets: ["otel-collector.observability.svc.cluster.local:8889"]
      metric_relabel_configs:
        - target_label: cluster
          replacement: obs
    - job_name: federate-dev
      scrape_interval: 30s
      honor_labels: true
      metrics_path: /federate
      params:
        "match[]":
          - '{job=~".+"}'
      static_configs:
        - targets:
            - "DEV_PROMETHEUS_TARGET"
      metric_relabel_configs:
        - target_label: cluster
          replacement: dev

alertmanager:
  enabled: false
kube-state-metrics:
  enabled: true
  prometheus:
    monitor:
      enabled: false
prometheus-node-exporter:
  enabled: true
  prometheus:
    monitor:
      enabled: false
prometheus-pushgateway:
  enabled: false
