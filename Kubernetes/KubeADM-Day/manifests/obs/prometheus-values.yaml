# obs cluster — Prometheus + Grafana (single Grafana for whole obs stack)
# dotdc dashboards 15757/15760 need label `cluster` on metrics (external_labels + federation).
server:
  global:
    scrape_interval: 15s
    external_labels:
      cluster: obs
  persistentVolume:
    enabled: false
  extraScrapeConfigs: |
    - job_name: kubernetes-pods-annotated
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod
    - job_name: otel-collector
      static_configs:
        - targets: ["otel-collector.observability.svc.cluster.local:8889"]
    # Federate dev cluster metrics (install-dev-metrics.sh on dev first).
    # Set DEV_PROMETHEUS_TARGET to dev master private IP, e.g. 10.110.100.184:30300
    - job_name: federate-dev
      scrape_interval: 30s
      honor_labels: true
      metrics_path: /federate
      params:
        "match[]":
          - '{job=~".+"}'
      static_configs:
        - targets:
            - "DEV_PROMETHEUS_TARGET"

alertmanager:
  enabled: false
kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: true
prometheus-pushgateway:
  enabled: false
