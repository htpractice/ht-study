# obs cluster — Prometheus + Grafana
# Chart v29+: extraScrapeConfigs is ROOT level (not under server:).
server:
  global:
    scrape_interval: 15s
  persistentVolume:
    enabled: false

extraScrapeConfigs: |
  - job_name: obs-kube-state-metrics
    static_configs:
      - targets: ["prometheus-kube-state-metrics.observability.svc.cluster.local:8080"]
    metric_relabel_configs:
      - target_label: cluster
        replacement: obs
  - job_name: obs-node-exporter
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: "(.*):10250"
        replacement: "${1}:9100"
        target_label: __address__
      - target_label: cluster
        replacement: obs
      - target_label: job
        replacement: obs-node-exporter
    metric_relabel_configs:
      - target_label: cluster
        replacement: obs
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector.observability.svc.cluster.local:8889"]
    metric_relabel_configs:
      - target_label: cluster
        replacement: obs

alertmanager:
  enabled: false
kube-state-metrics:
  enabled: true
  prometheus:
    monitor:
      enabled: false
prometheus-node-exporter:
  enabled: true
  hostNetwork: true
  tolerations:
    - operator: Exists
  prometheus:
    monitor:
      enabled: false
prometheus-pushgateway:
  enabled: false
