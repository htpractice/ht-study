# obs cluster — Loki + Promtail only (Grafana from grafana chart).
# Dev order-api logs: install-dev-promtail.sh pushes to Loki NodePort 30100.
grafana:
  enabled: false

promtail:
  enabled: true
  config:
    clients:
      - url: http://{{ .Release.Name }}:3100/loki/api/v1/push
        external_labels:
          cluster: obs

loki:
  enabled: true
  isDefault: false
  persistence:
    enabled: false
  service:
    type: NodePort
    port: 3100
    nodePort: 30100
