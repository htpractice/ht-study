# Multi-container Pod with two sequential init containers — Day 11 hands-on lab.
#
# Workflow:
#   1. Apply multicon-ns.yaml, multicon-deploy.yaml, multi-con-svc.yaml first.
#   2. Init 1 (init-svc-check-container): nslookup multi-cont-svc until DNS resolves.
#   3. Init 2 (init-dbsvc-check-container): nslookup multi-cont-dbsvc until DNS resolves.
#   4. Both inits exit (Completed); main app-container starts (Running).
#
# Init containers run in manifest order — second waits for first to complete.
# nslookup proves Service DNS exists, NOT that redis/mysql is accepting connections.
#
# Labels (env: multi-con-demo) differ from Deployment (app: multi-con-demo-nginx) on purpose.
#
# Debug:
#   kc logs multi-con-pod -n multicon -c init-svc-check-container
#   kc logs multi-con-pod -n multicon -c init-dbsvc-check-container
#   kc logs multi-con-pod -n multicon -c app-container
#   kc logs <deploy-pod> -n multicon -c db-container --previous   # CrashLoopBackOff
apiVersion: v1
kind: Pod
metadata:
  name: multi-con-pod
  namespace: multicon
  labels:
    env: multi-con-demo
spec:
  initContainers:
  - name: init-svc-check-container
    image: busybox:latest
    command: ['sh', '-c']
    args:
    - |
      until nslookup multi-cont-svc.multicon.svc.cluster.local; do
        echo waiting for web service DNS
        sleep 2
      done
  - name: init-dbsvc-check-container
    image: busybox:latest
    command: ['sh', '-c']
    args:
    - |
      until nslookup multi-cont-dbsvc.multicon.svc.cluster.local; do
        echo waiting for db service DNS
        sleep 2
      done
  containers:
  - name: app-container
    image: busybox:latest
    command: ['sh', '-c', 'echo the app is running && sleep 3600']
    env:
    - name: FIRSTNAME
      value: "harshal"
