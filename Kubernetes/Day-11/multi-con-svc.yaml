# ClusterIP Services for Day 11 init-container lab.
# Both select Deployment pods (app: multi-con-demo-nginx), NOT the init pod.
#
# multi-cont-svc     → nginx on port 80
# multi-cont-dbsvc   → redis on port 6379 (must match db-container containerPort)
#
# DNS the init containers wait for:
#   multi-cont-svc.multicon.svc.cluster.local
#   multi-cont-dbsvc.multicon.svc.cluster.local
#
# Imperative equivalents:
#   kc expose deployment multi-con-deploy -n multicon --name=multi-cont-svc --port=80 --target-port=80
#   kc expose deployment multi-con-deploy -n multicon --name=multi-cont-dbsvc --port=6379 --target-port=6379
apiVersion: v1
kind: Service
metadata:
  name: multi-cont-svc
  namespace: multicon
spec:
  selector:
    app: multi-con-demo-nginx
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: multi-cont-dbsvc
  namespace: multicon
spec:
  selector:
    app: multi-con-demo-nginx
  ports:
  - port: 6379
    targetPort: 6379
