# Simple Loki for obs-on-eks lab (loki-stack is more reliable than loki chart v6 for SingleBinary)
grafana:
  enabled: false

promtail:
  enabled: false

loki:
  enabled: true
  isDefault: false
  persistence:
    enabled: false
  config:
    auth_enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: LoadBalancer
    port: 3100
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
